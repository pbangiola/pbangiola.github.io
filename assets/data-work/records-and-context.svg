<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" role="img" aria-labelledby="title desc"><title id="title">Two ways the same relationship problem appears</title><desc id="desc">Conceptual examples. School records connect a student to separate assessment occasions. NextTask connects a project to its tasks. A result needs its assessment context; a task needs its parent project.</desc><rect width="1040" height="580" rx="14" fill="#f3f5f1"/><g font-family="system-ui, sans-serif" fill="#182434"><text x="42" y="48" font-size="15" letter-spacing="1">KEEP THE RECORD. KEEP ITS CONTEXT.</text><text x="42" y="100" font-size="25" font-weight="650">Student data</text><text x="560" y="100" font-size="25" font-weight="650">NextTask</text><path d="M520 80V475" stroke="#d3ddd6"/>
<rect x="42" y="130" width="436" height="85" rx="9" fill="#fff" stroke="#b6c9c0"/><text x="64" y="164" font-size="20" font-weight="650">Student record</text><text x="64" y="193" font-size="16" fill="#59677a">One person, across time</text><path d="M70 215V391M70 282H100M70 391H100" fill="none" stroke="#176b65" stroke-width="2"/><rect x="100" y="246" width="378" height="82" rx="9" fill="#fff" stroke="#d3ddd6"/><text x="120" y="279" font-size="19" font-weight="600">Fall assessment</text><text x="120" y="306" font-size="15" fill="#59677a">Result + date + assessment</text><rect x="100" y="355" width="378" height="82" rx="9" fill="#fff" stroke="#d3ddd6"/><text x="120" y="388" font-size="19" font-weight="600">Spring assessment</text><text x="120" y="415" font-size="15" fill="#59677a">Result + date + assessment</text><rect x="560" y="130" width="436" height="85" rx="9" fill="#fff" stroke="#b6c9c0"/><text x="582" y="164" font-size="20" font-weight="650">Project record</text><text x="582" y="193" font-size="16" fill="#59677a">One project, several tasks</text><path d="M588 215V391M588 282H618M588 391H618" fill="none" stroke="#176b65" stroke-width="2"/><rect x="618" y="246" width="378" height="82" rx="9" fill="#fff" stroke="#d3ddd6"/><text x="638" y="279" font-size="19" font-weight="600">First task</text><text x="638" y="306" font-size="15" fill="#59677a">Estimate + time spent + status</text><rect x="618" y="355" width="378" height="82" rx="9" fill="#fff" stroke="#d3ddd6"/><text x="638" y="388" font-size="19" font-weight="600">Second task</text><text x="638" y="415" font-size="15" fill="#59677a">Estimate + time spent + status</text><text x="42" y="501" font-size="17">Which result belongs to which occasion?</text><text x="560" y="501" font-size="17">Which work belongs in this total?</text><text x="42" y="549" font-size="14" fill="#59677a">Conceptual examples, not historical database schemas. No individual records are shown.</text></g></svg>